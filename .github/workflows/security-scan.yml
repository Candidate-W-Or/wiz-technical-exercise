name: Security Scan (Shift Left)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# FIXED: Permissions block added
permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  microsoft-security-devops:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Run Microsoft Security DevOps Analysis
        uses: microsoft/security-devops-action@v1
        id: msdo
        with:
          tools: 'checkov, terrascan, trivy'

      - name: Upload Alert Results to GitHub
        uses: github/codeql-action/upload-sarif@v3  # FIXED: v3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
